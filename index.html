<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curious AInough</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A practical guide to learning, creating, and making decisions with AI.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #087e75;
      --base-font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --base-background-color: #f7f8f4;
      --base-color: #253434;
      --heading-color: #173a38;
      --sidebar-background: #eef3ed;
      --sidebar-nav-link-color: #435654;
      --sidebar-nav-link-color--active: #087e75;
      --link-color: #087e75;
      --link-color--hover: #075f59;
    }
    body { letter-spacing: .005em; }
    .sidebar { border-right: 1px solid #dce6df; }
    .sidebar > h1 { font-weight: 750; letter-spacing: -.04em; }
    .sidebar-nav { padding: 0 1.5rem 2rem; }
    .sidebar-nav li a { border-radius: .45rem; transition: background .18s ease, color .18s ease; }
    .sidebar-nav li a:hover { background: #e1ebe4; text-decoration: none; }
    .content { padding-top: 1.5rem; }
    .markdown-section { max-width: 54rem; padding: 2.5rem 3rem 5rem; line-height: 1.75; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 { letter-spacing: -.035em; line-height: 1.2; }
    .markdown-section h1 { font-size: 2.5rem; }
    .markdown-section h2 { margin-top: 2.8rem; padding-bottom: .45rem; border-bottom: 1px solid #dce6df; }
    .markdown-section p, .markdown-section li { color: #435654; }
    .markdown-section a { font-weight: 550; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .markdown-section blockquote { padding: .8rem 1.2rem; border-left: 3px solid #72b5a8; background: #edf5f1; border-radius: 0 .6rem .6rem 0; }
    .markdown-section pre { border: 1px solid #dce6df; border-radius: .8rem; box-shadow: 0 8px 24px rgba(31, 63, 56, .06); }
    .markdown-section table { display: table; width: 100%; border-radius: .6rem; overflow: hidden; }
    .markdown-section table th { background: #eaf1eb; }
    @media (max-width: 768px) { .markdown-section { padding: 2rem 1.4rem 4rem; } .markdown-section h1 { font-size: 2rem; } }
    .student-notice {
      box-sizing: border-box;
      width: min(30rem, calc(100% - 2rem));
      max-height: calc(100% - 2rem);
      padding: 1.5rem;
      border: 1px solid #c9d8ed;
      border-radius: 0.75rem;
      color: #263238;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }
    .student-notice::backdrop {
      background: rgba(16, 31, 49, 0.55);
    }
    .student-notice h2 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
    }
    .student-notice p {
      line-height: 1.5;
    }
    .student-notice button {
      padding: 0.6rem 0.9rem;
      border: 0;
      border-radius: 0.4rem;
      background: #0969da;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .student-notice button:focus-visible,
    .student-notice a:focus-visible,
    .contribute-bar a:focus-visible {
      outline: 3px solid #f9c846;
      outline-offset: 3px;
    }
    .contribute-bar {
      margin-top: 3rem;
      padding: 1rem 1.25rem;
      border: 1px solid #c9d8ed;
      border-radius: 0.5rem;
      background: #f4f8fd;
    }
    .contribute-bar p {
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    .contribute-bar ul {
      margin: 0;
      padding-left: 1.25rem;
    }
    .contribute-bar a {
      font-weight: 600;
      text-decoration: underline;
    }
    .markdown-section .page-navigation {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid #d0d7de;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .markdown-section .page-navigation a { text-decoration: underline; }
    .markdown-section pre.activity-prompt {
      position: relative;
      padding-top: 3.25rem;
    }
    .activity-prompt-copy {
      position: absolute;
      top: 0.65rem;
      right: 0.75rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid #8c959f;
      border-radius: 0.35rem;
      background: #fff;
      color: #24292f;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .activity-prompt-copy:hover {
      background: #f3f4f6;
    }
    .activity-prompt-copy:focus-visible {
      outline: 3px solid #0969da;
      outline-offset: 2px;
    }
    #theme-toggle {
      position: fixed;
      z-index: 1000;
      top: 0.75rem;
      right: 5.75rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid #8c959f;
      border-radius: 0.4rem;
      background: #fff;
      color: #24292f;
      font: inherit;
      cursor: pointer;
    }
    #theme-toggle:focus-visible { outline: 3px solid #0969da; outline-offset: 2px; }
    html.dark-mode {
      color-scheme: dark;
      --theme-color: #81c7a5;
      --base-background-color: #101a17;
      --base-color: #e0ebe5;
      --heading-color: #b0ddc5;
      --sidebar-nav-link-color: #d3e3da;
      --base-font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html.dark-mode body,
    html.dark-mode #app,
    html.dark-mode .content { background: #101a17; color: #e0ebe5; }
    html.dark-mode .sidebar { background: #17241f; border-right-color: #2d4238; }
    html.dark-mode .sidebar-nav li a:hover { background: #23372e; }
    html.dark-mode .markdown-section p, html.dark-mode .markdown-section li { color: #c4d5cb; }
    html.dark-mode .markdown-section h2 { border-bottom-color: #2d4238; }
    html.dark-mode .markdown-section blockquote { background: #192922; }
    html.dark-mode .markdown-section pre { border-color: #2d4238; }
    html.dark-mode .markdown-section table th { background: #17241f; }
    html.dark-mode .sidebar a,
    html.dark-mode .sidebar ul li a { color: #c4d5cb; }
    html.dark-mode .markdown-section { color: #e0ebe5; }
    html.dark-mode .content .markdown-section h1,
    html.dark-mode .content .markdown-section h2,
    html.dark-mode .content .markdown-section h3,
    html.dark-mode .content .markdown-section h4,
    html.dark-mode .content .markdown-section h5,
    html.dark-mode .content .markdown-section h6,
    html.dark-mode .content .markdown-section h1 *,
    html.dark-mode .content .markdown-section h2 *,
    html.dark-mode .content .markdown-section h3 *,
    html.dark-mode .content .markdown-section h4 *,
    html.dark-mode .content .markdown-section h5 *,
    html.dark-mode .content .markdown-section h6 *,
    html.dark-mode .content .markdown-section strong { color: #b0ddc5 !important; -webkit-text-fill-color: #b0ddc5; opacity: 1 !important; text-shadow: 0 0 1px rgba(176, 221, 197, 0.35); }
    html.dark-mode .sidebar h1,
    html.dark-mode .sidebar-nav p { color: #b0ddc5 !important; }
    html.dark-mode .markdown-section a { color: #81c7a5; }
    html.dark-mode .sidebar a,
    html.dark-mode .sidebar ul li a { color: #e0ebe5 !important; }
    html.dark-mode .markdown-section table th { background: #17241f; }
    html.dark-mode .markdown-section table tr { border-color: #2d4238; }
    html.dark-mode .markdown-section table tr:nth-child(2n) { background: #17241f; }
    html.dark-mode .markdown-section table td,
    html.dark-mode .markdown-section table th { border-color: #2d4238; }
    html.dark-mode .markdown-section blockquote { color: #c4d5cb; border-left-color: #3d594b; }
    html.dark-mode .markdown-section pre,
    html.dark-mode .markdown-section code { background: #17241f; color: #e0ebe5; }
    html.dark-mode .search input { background: #101a17; color: #e0ebe5; border-color: #3d594b; }
    html.dark-mode .student-notice { background: #17241f; color: #e0ebe5; border-color: #3d594b; }
    html.dark-mode .contribute-bar { background: #17241f; border-color: #3d594b; }
    html.dark-mode .markdown-section .page-navigation { border-top-color: #3d594b; }
    html.dark-mode #theme-toggle,
    html.dark-mode .activity-prompt-copy { background: #23372e; color: #e0ebe5; border-color: #648675; }
  </style>
  <script>
    try {
      const savedTheme = localStorage.getItem('curious-ainough-theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (_) { /* Use the browser default if storage is unavailable. */ }
  </script>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">🌙 Dark mode</button>
  <div id="app"></div>
  <dialog class="student-notice" id="student-notice" aria-labelledby="student-notice-title">
    <h2 id="student-notice-title"></h2>
    <p id="student-notice-body"></p>
    <button id="student-notice-close" type="button">Continue to guide</button>
  </dialog>
  <script>
    const repoName = 'Alex-cmd-dev/Curious-AInough';

    window.$docsify = {
      name: '🧭 Curious AInough',
      basePath: location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1),
      relativePath: true,
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      alias: {
        '/09-large-language-models/README.md': '/10-large-language-models/README.md',
        '/10-ai-providers/README.md': '/01-ai-and-llms/README.md',
        '/09-understanding-ai-systems/README.md': '/10-large-language-models/README.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        paths: 'auto',
        placeholder: 'Search the guide...',
        noData: 'No results.'
      },
      flexibleAlerts: {
        style: 'callout'
      },
      repo: repoName,
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html, next) {
            next(html + contributeBar(vm.route.file === 'CONTRIBUTING.md'));
          });
          hook.doneEach(function () {
            showStudentNoticeForSection();
            addActivityPromptCopyButtons();
          });
        }
      ]
    }

    function contributeBar(onContributePage) {
      const repoUrl = 'https://github.com/' + repoName;
      const guide = onContributePage
        ? '<li><a href="' + repoUrl + '/compare" target="_blank" rel="noopener">🔀 Start a pull request ↗</a></li>'
        : '<li><a href="#/CONTRIBUTING.md">➕ Add an example or topic</a></li>';
      return '<div class="contribute-bar"><p>' + (onContributePage ? 'Make a change on GitHub' : 'Help improve this guide') + '</p><ul>' + guide +
        '<li><a href="' + repoUrl + '" target="_blank" rel="noopener">View the repository on GitHub ↗</a></li>' +
        '</ul></div>';
    }

    function addActivityPromptCopyButtons() {
      const route = window.location.hash.split('?')[0];
      if (!route.includes('/activities/')) return;

      document.querySelectorAll('.markdown-section pre').forEach(function (pre) {
        if (pre.querySelector('.activity-prompt-copy')) return;
        const code = pre.querySelector('code');
        if (!code) return;

        const button = document.createElement('button');
        button.className = 'activity-prompt-copy';
        button.type = 'button';
        button.textContent = 'Copy prompt';
        button.setAttribute('aria-label', 'Copy activity prompt');
        button.addEventListener('click', async function () {
          const prompt = code.innerText;
          try {
            await navigator.clipboard.writeText(prompt);
            button.textContent = 'Copied!';
          } catch (_) {
            button.textContent = 'Copy failed';
          }
          window.setTimeout(function () { button.textContent = 'Copy prompt'; }, 1800);
        });
        pre.classList.add('activity-prompt');
        pre.appendChild(button);
      });
    }

    // Sections that show the students warning, keyed by folder name.
    const studentNotices = {
      '05-research-and-verification': {
        title: 'Students: follow your course’s source and AI rules',
        body: 'If you use this guide for schoolwork, check your course’s citation and AI-use rules before relying on AI for research. Cite only sources you have opened and read, and be ready to explain how you found and checked them.'
      },
      '07-ethics-privacy-security': {
        title: 'Students: check your AI-use rules',
        body: 'If you use this guide for schoolwork, check your course and assignment rules before using AI. Use it to build understanding, verify its output, and submit work you can explain. Only share class or personal information with a tool when you have permission to do so.'
      }
    };

    const studentNotice = document.getElementById('student-notice');
    const studentNoticeTitle = document.getElementById('student-notice-title');
    const studentNoticeBody = document.getElementById('student-notice-body');
    let studentNoticeKey = null;

    function showStudentNoticeForSection() {
      const section = (location.hash.match(/^#\/([^/?]+)\//) || [])[1];
      const notice = studentNotices[section];
      if (!notice || studentNotice.open) return;
      const key = 'curious-ainough-student-notice:' + section;
      try { if (sessionStorage.getItem(key) === 'yes') return; } catch (_) { /* Storage may be unavailable. */ }
      studentNoticeKey = key;
      studentNoticeTitle.textContent = notice.title;
      studentNoticeBody.textContent = notice.body;
      studentNotice.showModal();
    }

    document.getElementById('student-notice-close').addEventListener('click', () => studentNotice.close());
    studentNotice.addEventListener('close', () => {
      try { sessionStorage.setItem(studentNoticeKey, 'yes'); } catch (_) { /* Storage may be unavailable. */ }
    });

    const themeToggle = document.getElementById('theme-toggle');
    function syncThemeToggle() {
      const dark = document.documentElement.classList.contains('dark-mode');
      themeToggle.textContent = dark ? '☀️ Light mode' : '🌙 Dark mode';
      themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      themeToggle.setAttribute('aria-pressed', String(dark));
    }
    syncThemeToggle();
    themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark-mode');
      try { localStorage.setItem('curious-ainough-theme', dark ? 'dark' : 'light'); } catch (_) { /* Choice lasts for this page view. */ }
      syncThemeToggle();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });</script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
</body>
</html>
