<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Curious AInough</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A practical guide to learning, creating, and making decisions with AI.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0969da;
    }
    .student-notice {
      box-sizing: border-box;
      width: min(30rem, calc(100% - 2rem));
      max-height: calc(100% - 2rem);
      padding: 1.5rem;
      border: 1px solid #c9d8ed;
      border-radius: 0.75rem;
      color: #263238;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }
    .student-notice::backdrop {
      background: rgba(16, 31, 49, 0.55);
    }
    .student-notice h2 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
    }
    .student-notice p {
      line-height: 1.5;
    }
    .student-notice button {
      padding: 0.6rem 0.9rem;
      border: 0;
      border-radius: 0.4rem;
      background: #0969da;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .student-notice button:focus-visible,
    .student-notice a:focus-visible,
    .contribute-bar a:focus-visible {
      outline: 3px solid #f9c846;
      outline-offset: 3px;
    }
    .contribute-bar {
      margin-top: 3rem;
      padding: 1rem 1.25rem;
      border: 1px solid #c9d8ed;
      border-radius: 0.5rem;
      background: #f4f8fd;
    }
    .contribute-bar p {
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    .contribute-bar ul {
      margin: 0;
      padding-left: 1.25rem;
    }
    .contribute-bar a {
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <dialog class="student-notice" id="student-notice" aria-labelledby="student-notice-title">
    <h2 id="student-notice-title"></h2>
    <p id="student-notice-body"></p>
    <button id="student-notice-close" type="button">Continue to guide</button>
  </dialog>
  <script>
    const repoName = 'Alex-cmd-dev/Curious-AInough';

    window.$docsify = {
      name: '🧭 Curious AInough',
      basePath: location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1),
      relativePath: true,
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      alias: {
        '/09-understanding-ai-systems/README.md': '/09-large-language-models/README.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        paths: 'auto',
        placeholder: 'Search the guide...',
        noData: 'No results.'
      },
      flexibleAlerts: {
        style: 'callout'
      },
      repo: repoName,
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html, next) {
            next(html + contributeBar(vm.route.file));
          });
          hook.doneEach(showStudentNoticeForSection);
        }
      ]
    }

    function contributeBar(file) {
      const repoUrl = 'https://github.com/' + repoName;
      const edit = file
        ? '<li><a href="' + repoUrl + '/edit/main/' + file + '" target="_blank" rel="noopener">✏️ Edit this page on GitHub ↗</a></li>'
        : '';
      const onContributePage = file === 'CONTRIBUTING.md';
      const guide = onContributePage
        ? '<li><a href="' + repoUrl + '/compare" target="_blank" rel="noopener">🔀 Start a pull request ↗</a></li>'
        : '<li><a href="#/CONTRIBUTING.md">➕ Add an example or topic</a></li>';
      return '<div class="contribute-bar"><p>' + (onContributePage ? 'Make a change on GitHub' : 'Help improve this guide') + '</p><ul>' + edit + guide +
        '<li><a href="' + repoUrl + '" target="_blank" rel="noopener">View the repository on GitHub ↗</a></li>' +
        '</ul></div>';
    }

    // Sections that show the students warning, keyed by folder name.
    const studentNotices = {
      '04-research-and-verification': {
        title: 'Students: follow your course’s source and AI rules',
        body: 'If you use this guide for schoolwork, check your course’s citation and AI-use rules before relying on AI for research. Cite only sources you have opened and read, and be ready to explain how you found and checked them.'
      },
      '06-ethics-privacy-security': {
        title: 'Students: check your AI-use rules',
        body: 'If you use this guide for schoolwork, check your course and assignment rules before using AI. Use it to build understanding, verify its output, and submit work you can explain. Only share class or personal information with a tool when you have permission to do so.'
      }
    };

    const studentNotice = document.getElementById('student-notice');
    const studentNoticeTitle = document.getElementById('student-notice-title');
    const studentNoticeBody = document.getElementById('student-notice-body');
    let studentNoticeKey = null;

    function showStudentNoticeForSection() {
      const section = (location.hash.match(/^#\/([^/?]+)\//) || [])[1];
      const notice = studentNotices[section];
      if (!notice || studentNotice.open) return;
      const key = 'curious-ainough-student-notice:' + section;
      try { if (sessionStorage.getItem(key) === 'yes') return; } catch (_) { /* Storage may be unavailable. */ }
      studentNoticeKey = key;
      studentNoticeTitle.textContent = notice.title;
      studentNoticeBody.textContent = notice.body;
      studentNotice.showModal();
    }

    document.getElementById('student-notice-close').addEventListener('click', () => studentNotice.close());
    studentNotice.addEventListener('close', () => {
      try { sessionStorage.setItem(studentNoticeKey, 'yes'); } catch (_) { /* Storage may be unavailable. */ }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
</body>
</html>
